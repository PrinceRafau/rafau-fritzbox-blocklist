
name: FritzBox Blocklist Update

on:
  schedule:
    - cron: '17 3 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python installieren
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Blockliste erstellen
        run: python3 fritzbox_filter_builder.py

      - name: Blockliste speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fritzbox_blocklist.txt
          if ! git diff --cached --quiet; then
            git commit -m "Automatische Aktualisierung"
            git push
          fi
